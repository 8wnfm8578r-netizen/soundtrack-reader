<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Soundtrack Reader 0.2</title><style>
:root{--bg:#f7f1e5;--fg:#302b24;--panel:#eee6d7;--size:21px;--leading:1.75;--measure:660px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui}body[data-theme=dark]{--bg:#191b20;--fg:#ddd9d0;--panel:#272a31}body[data-theme=light]{--bg:white;--fg:#222;--panel:#eee}header,footer{position:fixed;left:0;right:0;background:var(--panel);z-index:5;padding:12px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}header{top:0;padding-top:max(12px,env(safe-area-inset-top))}footer{bottom:0;padding-bottom:max(12px,env(safe-area-inset-bottom))}button,select{font:inherit;color:inherit;background:var(--bg);border:1px solid #888;border-radius:8px;padding:8px;cursor:pointer}header strong,#status{flex:1;font-size:14px}main{max-width:var(--measure);margin:auto;padding:100px 22px 150px;font:var(--size)/var(--leading) Georgia,serif}h1,h2{text-align:center;line-height:1.25}p{margin:0 0 1.1em}img{max-width:100%}dialog{background:var(--panel);color:var(--fg);border:1px solid #888;border-radius:14px;width:min(92vw,440px);max-height:80vh;overflow:auto;padding:20px}dialog label{display:block;margin:12px 0}dialog input[type=range]{width:100%}dialog::backdrop{background:#0006}#links button,#marks button{display:block;margin:8px 0;text-align:left}#notice{font:15px system-ui}#page{display:none}body.paged #page{display:block;position:fixed;top:82px;bottom:100px;left:0;right:0;overflow:hidden;margin:auto;max-width:var(--measure);padding:0 22px}body.paged main{margin:0;padding:0;max-width:none;height:100%;column-fill:auto;column-gap:44px;overflow:visible}body.paged #page{touch-action:pan-y}progress{width:100%;height:4px}small{opacity:.75}
</style><body><header><strong id="title">SOUNDTRACK READER · 0.2</strong><button id="import">Import</button><button id="toc">Contents</button><button id="settings">Aa</button></header><div id="holder"><main id="book"><h1>Your library</h1><p>Import a soundtrack ZIP or an EPUB to begin.</p><p id="notice"></p></main></div><footer><div id="status">No book loaded</div><button id="play">▶ Play</button><button id="prev">‹</button><button id="next">›</button><progress id="progress" max="100" value="0"></progress></footer><input hidden type="file" id="file" accept=".zip,.epub"><dialog id="prefs"><h2>Reading settings</h2><label>Theme <select id="theme"><option>sepia</option><option>light</option><option>dark</option></select></label><label>Text size <input id="size" type="range" min="16" max="32" value="21"></label><label>Line spacing <input id="leading" type="range" min="1.3" max="2.2" step=".05" value="1.75"></label><label>Text width <input id="measure" type="range" min="320" max="850" value="660"></label><label>Music volume <input id="volume" type="range" min="0" max="100" value="65"></label><label>Ambience volume <input id="ambient" type="range" min="0" max="100" value="25"></label><label>Fade seconds <input id="fade" type="range" min=".5" max="5" step=".5" value="2.5"></label><label><input id="paged" type="checkbox"> Paginated reading</label><label><input id="debug" type="checkbox"> Cue diagnostics</label><button id="bookmark">Add bookmark</button> <button id="close">Done</button></dialog><dialog id="contents"><h2>Contents</h2><div id="links"></div><h2>Bookmarks</h2><div id="marks"></div><button id="closeToc">Done</button></dialog><script src="jszip.min.js"></script><script src="reader.js"></script></body></html>
